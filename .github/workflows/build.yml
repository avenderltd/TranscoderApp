name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Create Base Flutter App & Inject Code
        run: |
          flutter create app
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
          cp AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.minSdkVersion/28/g' app/android/app/build.gradle.kts
          sed -i 's/flutter.compileSdkVersion/37/g' app/android/app/build.gradle.kts
          python3 - << 'PYEOF'
          import glob
          kt_files = glob.glob("app/android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          if kt_files:
              kt_path = kt_files[0]
              with open(kt_path, "r") as kf:
                  pkg_line = kf.readline().strip()
              kt_code = pkg_line + '''

import android.content.Intent
import android.net.Uri
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity : FlutterActivity() {
    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "pro_media_studio/email").setMethodCallHandler { call, result ->
            if (call.method == "openEmail") {
                try {
                    val to = call.argument<String>("to") ?: "info@avenderltd.com"
                    val subject = call.argument<String>("subject") ?: ""
                    val body = call.argument<String>("body") ?: ""
                    val uriStr = "mailto:" + Uri.encode(to) + "?subject=" + Uri.encode(subject) + "&body=" + Uri.encode(body)
                    val intent = Intent(Intent.ACTION_SENDTO, Uri.parse(uriStr))
                    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    startActivity(intent)
                    result.success(true)
                } catch (e: Exception) {
                    try {
                        val fallback = Intent(Intent.ACTION_SEND).apply {
                            type = "message/rfc822"
                            putExtra(Intent.EXTRA_EMAIL, arrayOf(call.argument<String>("to") ?: "info@avenderltd.com"))
                            putExtra(Intent.EXTRA_SUBJECT, call.argument<String>("subject") ?: "")
                            putExtra(Intent.EXTRA_TEXT, call.argument<String>("body") ?: "")
                            addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                        }
                        startActivity(Intent.createChooser(fallback, "Send Email").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                        result.success(true)
                    } catch (e2: Exception) {
                        result.success(false)
                    }
                }
            } else {
                result.notImplemented()
            }
        }
    }
}
'''
              with open(kt_path, "w") as kf:
                  kf.write(kt_code)
          PYEOF
          
      - name: Build APK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd app
          flutter pub get
          find /home/runner/.pub-cache/ -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9][0-9]/compileSdkVersion 37/g; s/compileSdk [0-9][0-9]/compileSdk 37/g; s/compileSdk = [0-9][0-9]/compileSdk = 37/g' {} +
          flutter build apk --release --split-per-abi
          
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
