name: Build Android APK & Play Store Bundle
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Permanent Play Store Upload Keystore Exists
        run: |
          if [ ! -f upload-keystore.jks ]; then
            keytool -genkey -v \
              -keystore upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass avender2026 \
              -keypass avender2026 \
              -dname "CN=Avender Ltd, OU=Mobile, O=Avender Ltd, C=GB"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add upload-keystore.jks
            git commit -m "Save permanent Play Store upload-keystore.jks [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Create Base Flutter App, Set Package ID & Configure Release Signing
        run: |
          flutter create --org com.avenderltd app
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
          cp AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          cp upload-keystore.jks app/android/app/upload-keystore.jks
          python3 -m pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          python3 - << 'PYEOF'
          import pathlib
          import pathlib, shutil
          from PIL import Image
          icon_src = pathlib.Path("app_icon.jpg")
          if icon_src.exists():
              res_dir = pathlib.Path("app/android/app/src/main/res")
              anydpi = res_dir / "mipmap-anydpi-v26"
              if anydpi.exists():
                  shutil.rmtree(anydpi)
              img = Image.open(icon_src).convert("RGBA")
              for folder, px in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
                  d = res_dir / folder
                  if d.exists():
                      resized = img.resize((px, px), Image.Resampling.LANCZOS)
                      resized.save(d / "ic_launcher.png", "PNG")
                      if (d / "ic_launcher_round.png").exists():
                          resized.save(d / "ic_launcher_round.png", "PNG")
              print("Custom launcher icons generated successfully!")
          p = pathlib.Path("app/android/app/build.gradle.kts")
          c = p.read_text()
          c = c.replace("flutter.minSdkVersion", "28")
          c = c.replace("flutter.compileSdkVersion", "37")
          c = c.replace("flutter.targetSdkVersion", "36")
          c = c.replace('applicationId = "com.avenderltd.app"', 'applicationId = "com.avenderltd.transcoderapp"')
          c = c.replace('applicationId = "com.example.app"', 'applicationId = "com.avenderltd.transcoderapp"')
          signing_block = """
              signingConfigs {
                  create("release") {
                      keyAlias = "upload"
                      keyPassword = "avender2026"
                      storeFile = file("upload-keystore.jks")
                      storePassword = "avender2026"
                  }
              }
              buildTypes {"""
          c = c.replace("    buildTypes {", signing_block, 1)
          c = c.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          p.write_text(c)
          root_gradle = pathlib.Path("app/android/build.gradle.kts")
          if root_gradle.exists():
              rg_text = root_gradle.read_text()
              if "lintVital" not in rg_text:
                  rg_text += '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital", ignoreCase = true)) {\n            enabled = false\n        }\n    }\n}\n'
                  root_gradle.write_text(rg_text)
          PYEOF

      - name: Build Signed APKs & Play Store AppBundle
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd app
          flutter pub get
          find /home/runner/.pub-cache/ -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9][0-9]/compileSdkVersion 37/g; s/compileSdk [0-9][0-9]/compileSdk 37/g; s/compileSdk = [0-9][0-9]/compileSdk = 37/g' {} +
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: |
            app/build/app/outputs/flutter-apk/app-*-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Signed Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            upload-keystore.jks
