# ============================================================================
# FILE: pubspec.yaml
# ============================================================================
name: transcoder_app
description: A frictionless offline AI media studio and local LLM assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_flutter_new: ^4.6.7
  whisper_flutter_new: ^1.0.1
  receive_sharing_intent: ^1.8.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  http: ^1.2.2
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  record: ^6.0.0
  device_info_plus: ^10.1.0
  google_mlkit_translation: ^0.11.0
  lib_llama_cpp: ^0.1.0

dependency_overrides:
  record_linux: ^1.2.1
  record_platform_interface: ^1.5.0

flutter:
  uses-material-design: true
